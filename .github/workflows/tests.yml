name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # micromamba needs a login shell for its activation hook
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7

      # Sibling packages, not on PyPI. Both are public, so no token is needed.
      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/em-blockrun
          path: .siblings/em-blockrun
      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/em-volume-tools
          path: .siblings/em-volume-tools

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true

      - name: Install the em-* packages
        # --no-deps is load-bearing: without it pip re-resolves conda-provided
        # binaries (tensorstore, h5py, numpy) from PyPI and invites the ABI mismatch
        # the environment file exists to avoid.
        run: |
          pip install --no-deps ./.siblings/em-blockrun ./.siblings/em-volume-tools
          pip install --no-deps -e .

      - name: Show what actually got installed
        # The conda-only pieces are the fragile part of this environment; make the
        # log say plainly whether they are present rather than inferring it from a
        # failure twenty lines later. dvidutils ships no .dist-info, so
        # importlib.metadata reports it missing while the import works — don't
        # chase that.
        run: |
          python -c "
          import importlib
          for m in ('vol2mesh', 'dvidutils', 'kimimaro', 'tensorstore', 'em_blockrun',
                    'em_volume_tools', 'em_seg_morpho'):
              try:
                  importlib.import_module(m); print(f'  ok      {m}')
              except Exception as e:
                  print(f'  FAILED  {m}: {type(e).__name__}: {e}'); raise
          "

      - name: Test
        run: pytest -q

      - name: Smoke-test the installed console script
        run: |
          pip install build
          python -m build --wheel -o dist/
          pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp && em-morpho --help > /dev/null && echo "em-morpho runs outside a checkout"

  # Ask the documentation site to rebuild, so the published CLI reference follows this
  # commit. `main` only, and only once the tests pass: the reference is generated from
  # the live parsers, so publishing from a red commit would document code nobody should
  # be running.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/em-libraries
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write
          # on em-libraries. When it is absent the step says so and succeeds — a docs
          # refresh that did not happen must not turn a green test run red, and the
          # site rebuilds on its nightly schedule regardless.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/em-libraries/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}"
          echo "::notice::asked em-libraries to rebuild its docs for $GITHUB_SHA"
