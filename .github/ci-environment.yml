# Conda environment for CI. Mirrors the shared `em-lib` environment, scoped to what
# this package's test suite needs.
#
# Why conda and not pip: `vol2mesh` and `dvidutils` are **conda-only**, from the
# public `flyem-forge` channel, with no PyPI equivalent — and they are built only for
# py312, which is what pins the whole environment to 3.12.
#
# The compiled scientific stack (numpy, scipy, tensorstore, h5py) comes from
# conda-forge rather than PyPI on purpose: `dvidutils` is a compiled extension built
# against conda's libraries, and mixing a pip-built numpy under it invites an ABI
# mismatch that surfaces as a segfault rather than an import error. Only the
# pure-Python packages that conda-forge does not carry are left to pip.
name: em-seg-morpho-ci

channels:
  - flyem-forge   # vol2mesh, dvidutils
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # orchestration (em-blockrun)
  - dask
  - distributed
  - dask-jobqueue>=0.8
  - pyyaml

  # volume I/O (em-volume-tools)
  - numpy>=2
  - scipy
  - tensorstore>=0.1.70
  - zarr>=3
  - ngff_zarr>=0.39
  - jsonschema
  - h5py
  - tifffile
  - imageio

  # meshes / skeletons (em-seg-morpho)
  - vol2mesh
  - dvidutils
  - trimesh

  - pytest

  # Pure-Python, not on conda-forge. osteoid is imported directly by
  # precomputed.py / fragments.py / skeleton.py; it arrives transitively via
  # kimimaro but is declared here because we import it ourselves.
  - pip:
      - kimimaro
      - DracoPy
      - osteoid
