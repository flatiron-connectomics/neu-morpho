# Rusty `gen`, node-type-agnostic (NO --constraint) so jobs start on whatever CPU
# node is free. Set `account` to your center (ccn/ccb/ccm/...) and `log-directory`
# to your ceph. This is the config to use unless you have a reason not to.
#
# Why no --constraint: `gen` holds three node types, and this workload needs
# nothing special from any of them.
#     rome     128 cores / 1 TB
#     icelake   64 cores / 1 TB
#     genoa     96 cores / 1.5 TB
# Pinning to genoa would drop ~2/3 of the eligible nodes to buy memory we do not
# use. Sizing below fits the *smallest* node (icelake: 64 cores, 1 TB), so the
# job is eligible everywhere.
#
# Why this much memory is plenty: the peak is one BLOCK, not one body — that is
# the whole point of the block-first design. A 256^3 uint64 block is 128 MB;
# kimimaro's TEASAR distance transforms are a few multiples of that, and vol2mesh
# holds the mesh set for the labels in that one block. Single-digit GB per
# worker, against the ~37 GB each gets here. If you raise --block to 512^3
# (8x the voxels), drop `processes` to keep the ratio.
jobqueue:
  slurm:
    cores: 64               # <= icelake core count, so icelake stays eligible
    processes: 24           # dask workers per job -> ~37 GB/worker at 900 GB
    memory: 900GB           # <= 1 TB so rome and icelake are both eligible
    walltime: "12:00:00"    # every stage is idempotent — a killed job just resumes

    account: your-account            # -A  (your center's account) -- EDIT ME
    queue: gen              # --partition
    # No job-extra-directives: let SLURM pick any free CPU node type.
    # If you ever DO need the fat nodes, add:
    #   job-extra-directives: ["--constraint=genoa"]
    # and raise cores to 96 / memory to 1400GB.

    name: em-seg-morpho
    log-directory: /path/to/scratch/dask-job-logs   # keep logs on ceph

distributed:
  scheduler:
    work-stealing: true
  worker:
    memory:
      # DISABLE dask's memory manager. Use `false`, NOT 0.0 — spilling a block's
      # mesh set to disk is slower than just letting the block finish.
      target: false
      spill: false
      pause: false
      terminate: false
  admin:
    tick:
      limit: 3h
